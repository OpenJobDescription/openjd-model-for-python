# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message: 
      prefix: "chore(deps):"
    ignore:
      # black 26+ drops Python 3.9 compat and produces different formatting
      - dependency-name: "black"
        update-types: ["version-update:semver-major"]
    # Combine all minor and patch bumps into a single PR. Major bumps do not
    # match this group and so each get their own individual PR.
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "cargo"
    directory: "/" # Workspace root; rust-bindings is discovered as a member
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps):"
    # Patch bumps are combined into a single PR. Minor bumps do not match this
    # group and so each get their own individual PR, because every crate this
    # package depends on is pre-1.0: for a 0.x crate cargo treats a minor bump
    # as breaking, so openjd-expr 0.3 -> 0.4 deserves its own review rather
    # than riding along with a patch.
    groups:
      cargo-patch:
        patterns:
          - "*"
        update-types:
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message: 
      prefix: "chore(github):"
    # Combine all minor and patch bumps into a single PR. Major bumps do not
    # match this group and so each get their own individual PR.
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"