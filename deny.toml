# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
#
# Adapted from openjd-rs's deny.toml. Differences:
#
# * `Apache-2.0 WITH LLVM-exception` is added to the allowlist; pyo3's
#   build-time dependency `target-lexicon` ships under that license.
#   The LLVM exception is strictly more permissive than plain Apache-2.0.
# * `multiple-versions` stays on `allow`. The bindings dep graph is much
#   smaller than openjd-rs's (no AWS SDK), but pyo3-stub-gen brings in
#   some duplicate transitives that are not actionable here.

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
